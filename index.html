function round2(n) { const v = Number(n); return Number.isFinite(v) ? Math.round(v * 100) / 100 : 0; }
function normStr(v) { return String(v || "").trim().toLowerCase(); }
function todayValue() {
  const d = new Date();
  return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
}
function currentMonthValue() { return todayValue().slice(0, 7); }

function clearMessage() {

function stockKey(item) {
  return [item.Buyer, item.Style, item.Fabric_Code, item.Fabric_Color, item.Composition, item.Unit]
    .map(v => normStr(v)).join("||");
}

function getStockByCombo() {
  const map = {};
  const add = (item, delta) => {
    const k = [item.Buyer, item.Style, item.Fabric_Code, item.Fabric_Color, item.Composition].map(normStr).join("||");
    map[k] = round2((map[k] || 0) + Number(delta || 0));
  };
  state.fabricOpening.forEach(x => add(x, x.Opening_Qty));
  state.fabricReceive.forEach(x => add(x, x.Receive_Qty));
  state.fabricIssue.forEach(x => add(x, -x.Issue_Qty));
  return map;
}

function validateStockTimeline(receiveOverride, issueOverrides) {
  const events = [];
  state.fabricOpening.forEach(o => {
    events.push({ date: o.Opening_Month + "-01", priority: 0, type: "OPENING", key: stockKey(o), qty: Number(o.Opening_Qty) || 0, id: o.Opening_ID });
  });
  state.fabricReceive.forEach(r => {
    const rec = (receiveOverride && normStr(r.Receive_ID) === normStr(receiveOverride.Receive_ID)) ? receiveOverride : r;
    events.push({ date: rec.Receive_Date, priority: 1, type: "RECEIVE", key: stockKey(rec), qty: Number(rec.Receive_Qty) || 0, id: rec.Receive_ID });
  });
  if (receiveOverride && !state.fabricReceive.some(r => normStr(r.Receive_ID) === normStr(receiveOverride.Receive_ID))) {
    events.push({ date: receiveOverride.Receive_Date, priority: 1, type: "RECEIVE", key: stockKey(receiveOverride), qty: Number(receiveOverride.Receive_Qty) || 0, id: receiveOverride.Receive_ID });
  }
  const issList = Array.isArray(issueOverrides) ? issueOverrides : (issueOverrides ? [issueOverrides] : []);
  const issMap = {};
  issList.forEach(i => { issMap[normStr(i.Issue_ID)] = i; });
  state.fabricIssue.forEach(i => {
    const rec = issMap[normStr(i.Issue_ID)] || i;
    events.push({ date: rec.Issue_Date, priority: 2, type: "ISSUE", key: stockKey(rec), qty: Number(rec.Issue_Qty) || 0, id: rec.Issue_ID });
  });
  issList.forEach(i => {
    if (!state.fabricIssue.some(old => normStr(old.Issue_ID) === normStr(i.Issue_ID))) {
      events.push({ date: i.Issue_Date, priority: 2, type: "ISSUE", key: stockKey(i), qty: Number(i.Issue_Qty) || 0, id: i.Issue_ID });
    }
  });
  events.sort((a, b) => a.date !== b.date ? a.date.localeCompare(b.date) : a.priority - b.priority);
  const bal = {};
  for (const ev of events) {
    bal[ev.key] = bal[ev.key] || 0;
    if (ev.type === "ISSUE") {
      bal[ev.key] -= ev.qty;
      if (bal[ev.key] < -0.0001) {
        throw new Error(`Stock Negative হবে! Issue ID: ${ev.id} | Date: ${ev.date} | Balance: ${round2(bal[ev.key])}`);
      }
    } else {
      bal[ev.key] += ev.qty;
    }
  }
  return true;
}

function uniqueMaster(field) {
  const s = new Set();
  state.fabricMaster.filter(m => !m.Status || normStr(m.Status) === "active").forEach(m => {
    const v = String(m[field] || "").trim();
    if (v) s.add(v);
  });
  return Array.from(s).sort();
}

function getFilteredMaster(buyer, style) {
  const active = state.fabricMaster.filter(m => !m.Status || normStr(m.Status) === "active");
  const byBuyer = buyer ? active.filter(m => normStr(m.Buyer) === normStr(buyer)) : [];
  const byStyle = style ? byBuyer.filter(m => normStr(m.Style) === normStr(style)) : byBuyer;
  const uniq = (arr, f) => Array.from(new Set(arr.map(x => String(x[f] || "").trim()).filter(Boolean))).sort();
  return {
    styles: uniq(byBuyer, "Style"),
    pos: uniq(byStyle, "PO"),
    garmentColors: uniq(byStyle, "Garment_Color"),
    fabricCodes: uniq(byStyle, "Fabric_Code"),
    fabricColors: uniq(byStyle, "Fabric_Color"),
    compositions: uniq(byStyle, "Composition")
  };
}

function lookupMasterOrderQty(buyer, style) {
  const f = state.fabricMaster.find(m => normStr(m.Buyer) === normStr(buyer) && normStr(m.Style) === normStr(style) && Number(m.Order_Qty) > 0);
  return f ? Number(f.Order_Qty) : 0;
}

function lookupMasterBulkDZ(buyer, style, fc) {
  const f = state.fabricMaster.find(m => normStr(m.Buyer) === normStr(buyer) && normStr(m.Style) === normStr(style) && (!fc || normStr(m.Fabric_Code) === normStr(fc)) && Number(m.Bulk_Consumption_DZ) > 0);
  return f ? Number(f.Bulk_Consumption_DZ) : 0;
}

function lookupPIBookingAndPrice(piNo) {
  let qty = 0, price = 0;
  state.fabricMaster.forEach(m => {
    if (normStr(m.PI_No) === normStr(piNo)) {
      qty += Number(m.Booking_Qty_Yards) || 0;
      if (Number(m.Unit_Price_USD) > 0) price = Number(m.Unit_Price_USD);
    }
  });
  return { qty: round2(qty), price };
}

function csvEscape(v) { return `"${String(v ?? "").replace(/"/g, '""')}"`; }
function downloadCSV(filename, lines) {
  const blob = new Blob(["\uFEFF" + lines.join("\n")], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url);
}

function cleanMasterDuplicates() {
  const seen = new Set();
  const before = state.fabricMaster.length;
  state.fabricMaster = state.fabricMaster.filter(m => {

    if (seen.has(k)) return false;
    seen.add(k); return true;
  });
  saveState();
  showMessage(`${before - state.fabricMaster.length}টি Duplicate Master Row পরিষ্কার করা হয়েছে।`, "success");
}

  };
  setDl("s", opts.styles);
  setDl("po", opts.pos);
  setDl("gc", opts.garmentColors);
  setDl("fc", opts.fabricCodes);
  setDl("fcol", opts.fabricColors);
  setDl("comp", opts.compositions);
}

    if (info.price > 0) row.querySelector('[data-f="unitPriceUSD"]').value = info.price;

  });

function onIssueRowChange(rid, autoBulk) {
  cascadeRow(rid);
  const row = document.getElementById(rid);
  const g = f => (row.querySelector(`[data-f="${f}"]`)?.value || "").trim();
  const buyer = g("buyer"), style = g("style"), fc = g("fabricCode"), fcol = g("fabricColor"), comp = g("composition");
  if (autoBulk) {
    const b = lookupMasterBulkDZ(buyer, style, fc);
    if (b > 0) row.querySelector('[data-f="bulkConsumptionDZ"]').value = b;
  }
  const orderQty = lookupMasterOrderQty(buyer, style);
  row.querySelector('[data-f="orderQty"]').value = orderQty > 0 ? orderQty : "";
  const bulkDz = Number(row.querySelector('[data-f="bulkConsumptionDZ"]').value || 0);
  const req = (orderQty > 0 && bulkDz > 0) ? round2((orderQty / 12) * bulkDz) : 0;
  const ex1 = round2(req * 0.01);
  row.querySelector('[data-f="fabricRequired"]').value = req > 0 ? req : "";
  row.querySelector('[data-f="cuttingExcess1Pct"]').value = ex1 > 0 ? ex1 : "";

  const availBox = row.querySelector('[data-f="availableFabric"]');
  const issQty = Number(row.querySelector('[data-f="issueQty"]').value || 0);
  if (buyer && style && fc) {
    const stockMap = getStockByCombo();
    const exactKey = [buyer, style, fc, fcol, comp].map(normStr).join("||");
    let avail = stockMap[exactKey];
    if (avail === undefined) {
      avail = 0;
      Object.keys(stockMap).forEach(k => {
        const p = k.split("||");
        if (p[0] === normStr(buyer) && p[1] === normStr(style) && p[2] === normStr(fc)) avail += stockMap[k];
      });
    }
    const rem = round2(avail - issQty);
    availBox.value = `${round2(avail)} (Rem: ${rem})`;
    availBox.classList.toggle("avail-low", rem < 0);
    availBox.classList.toggle("avail-ok", rem >= 0);
  } else {
    availBox.value = "";
    availBox.classList.remove("avail-low", "avail-ok");
  }
  checkIssueExcess();
}

function checkIssueExcess() {
  const box = document.getElementById("issueExcessBox");
  if (!box) return;
  if (normStr(currentUser().role) === "admin") { box.style.display = "none"; return; }
  let needs = false;
  document.querySelectorAll("#issueRows .batch-row").forEach(row => {
    const req = Number(row.querySelector('[data-f="fabricRequired"]').value || 0);
    const ex = Number(row.querySelector('[data-f="cuttingExcess1Pct"]').value || 0);
    const iss = Number(row.querySelector('[data-f="issueQty"]').value || 0);
    if (req + ex > 0 && iss > req + ex + 0.0001) needs = true;
  });
  box.style.display = needs ? "block" : "none";
}

function saveIssueBatch() {
  const date = document.getElementById("issDate").value;

  let approvedBy = "";
  const needsBox = document.getElementById("issueExcessBox").style.display === "block";
  if (needsBox) {
    const adm = state.users.find(u => normStr(u.role) === "admin" && u.password === adminPw && normStr(u.status) === "active");
    if (!adm) { showMessage("1% Excess-এর বেশি Issue করতে সঠিক Admin Password দিন।", "error"); return; }

  const rows = Array.from(document.querySelectorAll("#issueRows .batch-row")).map(row => {

let lastStockRows = [];
function loadMonthlyStock() {
  const month = document.getElementById("stockMonth")?.value || currentMonthValue();
  const firstDay = month + "-01";
  const lastDay = month + "-31";
  const items = {};
  const addMeta = it => {
    const k = stockKey(it);
    if (!items[k]) items[k] = { ...it, opening: 0, receive: 0, issue: 0 };
  };
  state.fabricOpening.forEach(o => {
    addMeta(o);
    if (o.Opening_Month <= month) items[stockKey(o)].opening += Number(o.Opening_Qty) || 0;
  });
  state.fabricReceive.forEach(r => {
    addMeta(r);
    const k = stockKey(r);
    if (r.Receive_Date < firstDay) items[k].opening += Number(r.Receive_Qty) || 0;
    else if (r.Receive_Date <= lastDay) items[k].receive += Number(r.Receive_Qty) || 0;
  });
  state.fabricIssue.forEach(i => {
    addMeta(i);
    const k = stockKey(i);
    if (i.Issue_Date < firstDay) items[k].opening -= Number(i.Issue_Qty) || 0;
    else if (i.Issue_Date <= lastDay) items[k].issue += Number(i.Issue_Qty) || 0;
  });

  lastStockRows = Object.values(items).map(x => ({
    ...x,
    closing: round2(x.opening + x.receive - x.issue)
  })).sort((a, b) => (a.Buyer + a.Style).localeCompare(b.Buyer + b.Style));

  document.getElementById("stockTableBody").innerHTML = lastStockRows.map((r, i) => `
    <tr>
      <td>${i + 1}</td><td>${r.Buyer}</td><td>${r.Style}</td><td>${r.Fabric_Code}</td><td>${r.Fabric_Color}</td>
      <td>${r.Composition}</td><td>${r.Unit}</td>
      <td style="text-align:right;">${round2(r.opening).toLocaleString()}</td>
      <td style="text-align:right;">${round2(r.receive).toLocaleString()}</td>
      <td style="text-align:right;">${round2(r.issue).toLocaleString()}</td>
      <td style="text-align:right;font-weight:bold;">${r.closing.toLocaleString()}</td>
      <td>${r.Remarks || ""}</td>
    </tr>
  `).join("");

  const yds = { o: 0, r: 0, i: 0, c: 0 }, kgs = { o: 0, r: 0, i: 0, c: 0 };
  lastStockRows.forEach(x => {
    const t = x.Unit === "Kgs" ? kgs : yds;
    t.o += x.opening; t.r += x.receive; t.i += x.issue; t.c += x.closing;
  });
  const sum = document.getElementById("stockSummary");
  sum.style.display = "block";
  sum.innerHTML = `
    <div><strong>Month:</strong> ${month}</div>
    <div><strong>Yards</strong> → Opening: ${round2(yds.o).toLocaleString()} | Receive: ${round2(yds.r).toLocaleString()} | Issue: ${round2(yds.i).toLocaleString()} | Closing: ${round2(yds.c).toLocaleString()}</div>
    <div><strong>Kgs</strong> → Opening: ${round2(kgs.o).toLocaleString()} | Receive: ${round2(kgs.r).toLocaleString()} | Issue: ${round2(kgs.i).toLocaleString()} | Closing: ${round2(kgs.c).toLocaleString()}</div>
  `;
}

function downloadStockCSV() {
  const headers = ["SL","Buyer","Style","Fabric Code","Fabric Color","Composition","Unit","Opening","Receive","Issue","Closing","Remarks"];
  const lines = [headers.map(csvEscape).join(",")].concat(
    lastStockRows.map((r, i) => [i+1, r.Buyer, r.Style, r.Fabric_Code, r.Fabric_Color, r.Composition, r.Unit, round2(r.opening), round2(r.receive), round2(r.issue), r.closing, r.Remarks||""].map(csvEscape).join(","))
  );
  downloadCSV(`Fabric_Stock_${document.getElementById("stockMonth").value}.csv`, lines);
}

function updDept(dept, id, f, val, isNum = false) {
  const row = state[dept].find(r => r.id === id);
  if (!row) return;
  row[f] = isNum ? (parseFloat(val) || 0) : val;
  saveState();
  renderWorkspace();
}
function delDeptRow(dept, id) {
  state[dept] = state[dept].filter(r => r.id !== id);
  saveState();
  renderWorkspace();
  showMessage("Row removed.", "success");
}

function renderDeptTab(dept) {
  const titles = {
    cutting: "Cutting Department — Daily Production Tracking",
    sewing: "Sewing Department — Daily Efficiency Report",
    wash: "Wash Department — Challan & Sample WIP Report",
    finishing: "Finishing Department — WIP & Shipment Report"
  };
  return `
    <div class="card">
      <h3>${titles[dept]}</h3>
      <div class="button-row" style="margin-top:0;margin-bottom:12px;">
        <button class="btn-secondary" type="button" onclick="openAddDeptModal('${dept}')">+ Add Row</button>
        <button class="btn-teal" type="button" onclick="exportDeptCSV('${dept}')">Download CSV</button>

      <div class="table-wrap">${buildDeptTable(dept)}</div>
      <p class="muted" style="margin-top:10px;">Tip: White cells are editable inline; shaded cells auto-calculate Excel formulas.</p>
    </div>
  `;
}

function buildDeptTable(dept) {
  const rows = state[dept];
  if (dept === "cutting") {
    return `<table><thead><tr><th>Buyer</th><th>Style</th><th>PO</th><th>Color</th><th>Order Qty</th><th>Plan %</th><th>Plan Qty</th><th>Conj/DZ</th><th>Fab Req</th><th>Fab Rec</th><th>Fab Used</th><th>Fab Bal</th><th>Cut Day</th><th>Cut Total</th><th>Cut Bal</th><th>Line</th><th>Input Tot</th><th>WIP</th><th>Status</th><th></th></tr></thead><tbody>
      ${rows.map(r => {
        const plan = Math.round(r.orderQty * r.cutPlanPct);
        const req = Math.round((plan / 12) * r.bulkConj);
        const fbal = r.fabRecTotal - r.fabUsedTotal - (r.fabReturn || 0);
        const cbal = r.cutTotal - plan;
        const wip = r.inputTotal - r.cutTotal;
        return `<tr>
          <td><input class="tbl-inp" value="${r.buyer}" onchange="updDept('cutting','${r.id}','buyer',this.value)"></td>
          <td><input class="tbl-inp" value="${r.style}" onchange="updDept('cutting','${r.id}','style',this.value)"></td>
          <td><input class="tbl-inp" value="${r.po}" onchange="updDept('cutting','${r.id}','po',this.value)"></td>
          <td><input class="tbl-inp" value="${r.color}" onchange="updDept('cutting','${r.id}','color',this.value)"></td>
          <td><input type="number" class="tbl-inp" value="${r.orderQty}" onchange="updDept('cutting','${r.id}','orderQty',this.value,true)"></td>
          <td><input type="number" step="0.01" class="tbl-inp" value="${r.cutPlanPct}" onchange="updDept('cutting','${r.id}','cutPlanPct',this.value,true)"></td>
          <td class="calc-cell">${plan.toLocaleString()}</td>
          <td><input type="number" step="0.01" class="tbl-inp" value="${r.bulkConj}" onchange="updDept('cutting','${r.id}','bulkConj',this.value,true)"></td>
          <td class="calc-cell">${req.toLocaleString()}</td>
          <td><input type="number" class="tbl-inp" value="${r.fabRecTotal}" onchange="updDept('cutting','${r.id}','fabRecTotal',this.value,true)"></td>
          <td><input type="number" class="tbl-inp" value="${r.fabUsedTotal}" onchange="updDept('cutting','${r.id}','fabUsedTotal',this.value,true)"></td>
          <td class="calc-cell">${fbal.toLocaleString()}</td>
          <td><input type="number" class="tbl-inp" value="${r.cutDay}" onchange="updDept('cutting','${r.id}','cutDay',this.value,true)"></td>
          <td><input type="number" class="tbl-inp" value="${r.cutTotal}" onchange="updDept('cutting','${r.id}','cutTotal',this.value,true)"></td>
          <td class="calc-cell">${cbal.toLocaleString()}</td>
          <td><input class="tbl-inp" value="${r.lineNo}" onchange="updDept('cutting','${r.id}','lineNo',this.value)"></td>
          <td><input type="number" class="tbl-inp" value="${r.inputTotal}" onchange="updDept('cutting','${r.id}','inputTotal',this.value,true)"></td>
          <td class="calc-cell">${wip.toLocaleString()}</td>
          <td><input class="tbl-inp" value="${r.status}" onchange="updDept('cutting','${r.id}','status',this.value)"></td>
          <td><button class="btn-danger btn-sm" onclick="delDeptRow('cutting','${r.id}')">✕</button></td>
        </tr>`;
      }).join("")}
    </tbody></table>`;
  }
  if (dept === "sewing") {
    return `<table><thead><tr><th>Floor</th><th>Line</th><th>Buyer</th><th>Style</th><th>PO</th><th>Color</th><th>Order Qty</th><th>Input</th><th>Output</th><th>WIP</th><th>SMV</th><th>Target</th><th>Achieved</th><th>Ach %</th><th>Effi %</th><th>Manpower</th><th></th></tr></thead><tbody>
      ${rows.map(r => {
        const wip = r.totalInput - r.totalOutput;
        const ach = r.target > 0 ? ((r.targetAchieved / r.target) * 100).toFixed(1) : "0.0";
        return `<tr>

  }
  if (dept === "wash") {
    return `<table><thead><tr><th>Line</th><th>Buyer</th><th>Style</th><th>PO</th><th>Color</th><th>Order Qty</th><th>Total Cut</th><th>QC Sew</th><th>Sew Bal</th><th>Plant</th><th>Challan</th><th>Wash Send</th><th>Sample Send</th><th>Send WIP</th><th>Wash Rec</th><th>Rec WIP</th><th></th></tr></thead><tbody>
      ${rows.map(r => {
        const sbal = r.totalCut - r.qcSewTotal;
        const samp = (r.sizeSet||0)+(r.shadeSample||0)+(r.labTest||0)+(r.prs||0);
        const swip = r.washSendTotal + samp + (r.missing||0) - r.qcSewTotal;
        const rwip = r.washRecTotal - r.washSendTotal;
        return `<tr>
          <td><input class="tbl-inp" value="${r.line}" onchange="updDept('wash','${r.id}','line',this.value)"></td>

          <td><input type="number" class="tbl-inp" value="${r.orderQty}" onchange="updDept('wash','${r.id}','orderQty',this.value,true)"></td>

        </tr>`;
      }).join("")}
    </tbody></table>`;
  }
  return `<table><thead><tr><th>Line</th><th>Buyer</th><th>Style</th><th>PO</th><th>Color</th><th>Order Qty</th><th>Wash Rec</th><th>Thread Cut</th><th>Button</th><th>Metal Pass</th><th>Pack Day</th><th>Pack Total</th><th>Floor WIP</th><th>Ship Total</th><th>Short/Ex</th><th></th></tr></thead><tbody>
    ${rows.map(r => {
      const fwip = r.packTotal - r.washRecTotal;
      const se = r.shipTotal - r.orderQty;
      return `<tr>
        <td><input class="tbl-inp" value="${r.line}" onchange="updDept('finishing','${r.id}','line',this.value)"></td>

}

function saveAddDeptRow(e, dept) {
  e.preventDefault();
  const base = {
    id: newId(dept[0].toUpperCase()),
    buyer: document.getElementById("m-buyer").value.trim(),
    style: document.getElementById("m-style").value.trim(),
    po: document.getElementById("m-po").value.trim(),
    color: document.getElementById("m-color").value.trim(),
    orderQty: Number(document.getElementById("m-order").value) || 0
  };
  const line = document.getElementById("m-line").value.trim();
  if (dept === "cutting") state.cutting.unshift({ ...base, cutPlanPct: 1.03, bulkConj: 15, fabRecDay: 0, fabRecTotal: 0, fabUsedTotal: 0, fabReturn: 0, cutDay: 0, cutTotal: 0, lineNo: line, inputDay: 0, inputTotal: 0, status: "RUNNING", remarks: "" });
  if (dept === "sewing") state.sewing.unshift({ ...base, floor: "4th Floor", line, totalInput: 0, totalOutput: 0, smv: 20, cm: 1.75, days: 1, target: 300, targetAchieved: 0, dayEffi: 0, prodManHr: 0, manpower: 40 });
  if (dept === "wash") state.wash.unshift({ ...base, line, shipDate: todayValue(), totalCut: 0, qcSewDay: 0, qcSewTotal: 0, washPlant: "NWP", challanNo: "", washSendDay: 0, washSendTotal: 0, sizeSet: 0, shadeSample: 0, labTest: 0, prs: 0, sampleRcv: 0, missing: 0, recChallanNo: "", washRecDay: 0, washRecTotal: 0, remarks: "" });
  if (dept === "finishing") state.finishing.unshift({ ...base, line, washRecDay: 0, washRecTotal: 0, threadCutDay: 0, threadCutTotal: 0, buttonDay: 0, buttonTotal: 0, metalPassDay: 0, metalPassTotal: 0, packDay: 0, packTotal: 0, shipDay: 0, shipTotal: 0, remarks: "" });
  saveState(); closeModal(); renderWorkspace(); showMessage("New row added.");
}

function exportDeptCSV(dept) {
  const rows = state[dept];
  if (!rows.length) return;
  const headers = Object.keys(rows[0]).filter(k => k !== "id");
  const lines = [headers.map(csvEscape).join(",")].concat(rows.map(r => headers.map(h => csvEscape(r[h])).join(",")));
  downloadCSV(`NDL_Unit02_${dept}.csv`, lines);
}

function openSubmitDeptModal(dept) {
  openModal(`
    <h3 style="margin-top:0;color:#17365d;">Submit ${dept.toUpperCase()} Daily Report to Admin</h3>

function submitDeptReport(e, dept) {
  e.preventDefault();
  const u = currentUser();
  state.submissions.unshift({
    id: newId("SUB"),
    dept: dept[0].toUpperCase() + dept.slice(1),
    submittedBy: u.email,
    submittedByName: u.name,
    reportDate: document.getElementById("sub-date").value,
    rowCount: state[dept].length,
    notes: document.getElementById("sub-notes").value.trim(),
    status: "Pending Review",
    adminNote: "",
    timestamp: new Date().toISOString().slice(0, 16).replace("T", " ")
  });
  saveState(); closeModal(); renderTabs(); renderWorkspace(); showMessage("Report submitted to Administrator.");
}

function renderMasterTab() {
  const map = {};
  const ensure = (po, buyer, style, color, orderQty) => {
    const k = `${po}__${style}`;
    if (!map[k]) map[k] = { po, buyer, style, color, orderQty: Number(orderQty) || 0, cut: 0, sew: 0, washSend: 0, washRec: 0, pack: 0, ship: 0 };
    return map[k];
  };
  state.cutting.forEach(r => { ensure(r.po, r.buyer, r.style, r.color, r.orderQty).cut += Number(r.cutTotal) || 0; });
  state.sewing.forEach(r => { ensure(r.po, r.buyer, r.style, r.color, r.orderQty).sew += Number(r.totalOutput) || 0; });
  state.wash.forEach(r => { const m = ensure(r.po, r.buyer, r.style, r.color, r.orderQty); m.washSend += Number(r.washSendTotal) || 0; m.washRec += Number(r.washRecTotal) || 0; });
  state.finishing.forEach(r => { const m = ensure(r.po, r.buyer, r.style, r.color, r.orderQty); m.pack += Number(r.packTotal) || 0; m.ship += Number(r.shipTotal) || 0; });

  return `
    <div class="card">
      <h3>Master Unit-02 Cut-to-Ship Consolidated Report</h3>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Buyer</th><th>Style</th><th>PO</th><th>Color</th><th>Order Qty</th><th>Cutting</th><th>Sewing Out</th><th>Wash Send</th><th>Wash Rec</th><th>Packed</th><th>Shipped</th><th>Short/Excess</th></tr></thead>
          <tbody>${Object.values(map).map(r => `<tr>
            <td><strong>${r.buyer}</strong></td><td>${r.style}</td><td>${r.po}</td><td>${r.color}</td>
            <td style="text-align:right;">${r.orderQty.toLocaleString()}</td>
            <td style="text-align:right;">${r.cut.toLocaleString()}</td>
            <td style="text-align:right;">${r.sew.toLocaleString()}</td>
            <td style="text-align:right;">${r.washSend.toLocaleString()}</td>
            <td style="text-align:right;">${r.washRec.toLocaleString()}</td>
            <td style="text-align:right;">${r.pack.toLocaleString()}</td>
            <td style="text-align:right;font-weight:bold;">${r.ship.toLocaleString()}</td>
            <td style="text-align:right;font-weight:bold;">${(r.ship - r.orderQty).toLocaleString()}</td>
          </tr>`).join("")}</tbody>
        </table>
      </div>
    </div>
  `;
}

function approveSub(id) {
  const s = state.submissions.find(x => x.id === id);
  if (s) { s.status = "Approved"; if (!s.adminNote) s.adminNote = "Approved by Administrator."; saveState(); renderTabs(); renderWorkspace(); showMessage("Submission approved."); }
}
function returnSubModal(id) {
  openModal(`
    <h3 style="margin-top:0;color:#17365d;">Return for Revision</h3>
    <form onsubmit="saveReturnSub(event,'${id}')">
      <div class="field"><label>Feedback *</label><textarea id="ret-fb" rows="3" required></textarea></div>
      <div class="button-row"><button type="submit" class="btn-danger">Return</button><button type="button" class="btn-secondary" onclick="closeModal()">Cancel</button></div>
    </form>
  `);
}
function saveReturnSub(e, id) {
  e.preventDefault();
  const s = state.submissions.find(x => x.id === id);
  if (s) { s.status = "Needs Revision"; s.adminNote = document.getElementById("ret-fb").value.trim(); saveState(); }
  closeModal(); renderTabs(); renderWorkspace(); showMessage("Returned for revision.");
}

function renderUsersTab() {
  return `
    <div class="card">
      <h3>User Management &amp; Access Control</h3>
      <div class="button-row" style="margin-top:0;margin-bottom:12px;">
        <button class="btn-success" type="button" onclick="openUserModal()">+ Create User</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>User ID</th><th>Name</th><th>Email</th><th>Password</th><th>Role</th><th>Department</th><th>Status</th><th>Actions</th></tr></thead>
          <tbody>${state.users.map(u => `<tr>
            <td>${u.id}</td><td><strong>${u.name}</strong></td><td>${u.email}</td><td><code>${u.password}</code></td>
            <td>${u.role}</td><td>${u.dept}</td>
            <td><span class="badge ${u.status === "Active" ? "badge-ok" : "badge-err"}">${u.status}</span></td>
            <td>
              <button class="btn-sm" onclick="openUserModal('${u.id}')">Edit</button>
              ${u.email !== state.currentUserEmail ? `<button class="btn-secondary btn-sm" onclick="toggleUser('${u.id}')">${u.status === "Active" ? "Disable" : "Enable"}</button>` : ""}
            </td>
          </tr>`).join("")}</tbody>
        </table>
      </div>
    </div>
  `;
}

function openUserModal(uid = "") {
  const u = uid ? state.users.find(x => x.id === uid) : null;
  openModal(`
    <h3 style="margin-top:0;color:#17365d;">${u ? "Edit User" : "Create User"}</h3>
    <form onsubmit="saveUser(event,'${uid}')">
      <div class="grid">
        <div class="field"><label>Name *</label><input id="u-name" required value="${u ? u.name : ""}"></div>
        <div class="field"><label>Email *</label><input id="u-email" type="email" required value="${u ? u.email : ""}"></div>
        <div class="field"><label>Password *</label><input id="u-pw" required value="${u ? u.password : ""}"></div>
        <div class="field"><label>Department *</label>
          <select id="u-dept">
            <option value="All" ${u?.role === "Admin" ? "selected" : ""}>All (Administrator)</option>
            <option value="Fabric" ${u?.dept === "Fabric" ? "selected" : ""}>Fabric Store</option>
            <option value="Cutting" ${u?.dept === "Cutting" ? "selected" : ""}>Cutting</option>
            <option value="Sewing" ${u?.dept === "Sewing" ? "selected" : ""}>Sewing</option>
            <option value="Wash" ${u?.dept === "Wash" ? "selected" : ""}>Wash</option>
            <option value="Finishing" ${u?.dept === "Finishing" ? "selected" : ""}>Finishing</option>
          </select>
        </div>
      </div>
      <div class="button-row"><button type="submit" class="btn-success">Save User</button><button type="button" class="btn-secondary" onclick="closeModal()">Cancel</button></div>
    </form>
  `);
}

function saveUser(e, uid) {
  e.preventDefault();
  const name = document.getElementById("u-name").value.trim();
  const email = normStr(document.getElementById("u-email").value);
  const password = document.getElementById("u-pw").value;
  const dept = document.getElementById("u-dept").value;
  const role = dept === "All" ? "Admin" : "Dept";
  if (uid) {
    const u = state.users.find(x => x.id === uid);
    if (u) { u.name = name; u.email = email; u.password = password; u.role = role; u.dept = dept; }
  } else {
    state.users.push({ id: newId("USR"), name, email, password, role, dept, desktopWrite: true, status: "Active" });
  }
  saveState(); closeModal(); renderWorkspace(); showMessage("User saved.");
}

function toggleUser(uid) {
  const u = state.users.find(x => x.id === uid);
  if (u) { u.status = u.status === "Active" ? "Inactive" : "Active"; saveState(); renderWorkspace(); }
}

function renderBonusTab() {
  return `
    <div class="card">
      <h3>NDL Bonus Policy Calculator (Sheet3)</h3>
      <div class="grid">
        <div class="field"><label>Category</label><select id="b-cat" onchange="calcBonus()"><option value="worker">Worker</option><option value="staff">Staff</option></select></div>
        <div class="field"><label>Service Days</label><input id="b-days" type="number" value="200" oninput="calcBonus()"></div>
        <div class="field"><label>Basic Salary (BDT)</label><input id="b-sal" type="number" value="12500" oninput="calcBonus()"></div>
      </div>
      <div id="b-out" class="summary">Bonus Tier: 75% | Payable: 9,375 BDT</div>
    </div>
  `;
}

function calcBonus() {
  const cat = document.getElementById("b-cat").value;
  const days = Number(document.getElementById("b-days").value) || 0;
  const sal = Number(document.getElementById("b-sal").value) || 0;
  let pct = 0;
  if (cat === "worker") { if (days >= 365) pct = 100; else if (days >= 180) pct = 75; else if (days >= 88) pct = 40; }
  else { if (days >= 365) pct = 80; else if (days >= 180) pct = 40; }
  document.getElementById("b-out").textContent = `Bonus Tier: ${pct}% | Payable: ${Math.round(sal * pct / 100).toLocaleString()} BDT`;
}

renderApp();
</script>
</body>
</html>
